<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도원이의 운동일지</title>
<meta name="description" content="헬스 루틴 · 식단 관리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1116" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도원이의 운동일지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000;overscroll-behavior-y:none}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling content (max 560px), fixed bottom tab bar.
   Split colors borrow competition plate colors: 가슴=red(25), 등=blue(20), 어깨+하체=yellow(15). */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#121820; --muted:#5A6572; --line:#D8DEE5;
  --p-red:#CF3A2E; --p-blue:#1E56C8; --p-yellow:#C99700; --p-green:#23935A;
  --ok:#1C8550; --warn:#A86C00; --bad:#BF3A2F;
  --btn:#121820; --btn-ink:#FFFFFF; --chip:#E4E8ED;
  --f-display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1116; --surface:#161B22; --surface-2:#1C222B; --ink:#E7EBF0; --muted:#8C97A4; --line:#29313B;
    --p-red:#F0604F; --p-blue:#5D8DFF; --p-yellow:#E9B930; --p-green:#45C07E;
    --ok:#45C07E; --warn:#E7A93A; --bad:#F0604F;
    --btn:#E7EBF0; --btn-ink:#0D1116; --chip:#232A34;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1116; --surface:#161B22; --surface-2:#1C222B; --ink:#E7EBF0; --muted:#8C97A4; --line:#29313B;
  --p-red:#F0604F; --p-blue:#5D8DFF; --p-yellow:#E9B930; --p-green:#45C07E;
  --ok:#45C07E; --warn:#E7A93A; --bad:#F0604F;
  --btn:#E7EBF0; --btn-ink:#0D1116; --chip:#232A34;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-size:21px;white-space:nowrap;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;border-radius:50%;border:4px solid var(--p-blue);background:var(--bg)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud::before{background:var(--ok)}
.view{display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.h-date{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.h-date h1{font-family:var(--f-display);font-size:28px;font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btn{appearance:none;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:13px 16px;cursor:pointer;width:100%;font-size:15.5px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.btn.danger{background:var(--bad);color:#fff}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--p-blue);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.wd b{font-size:12px;color:var(--muted);font-weight:600}
.wd span{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wd .pd{width:14px;height:14px;border-radius:50%;border:3px solid var(--c,var(--line))}
.wd.done .pd{background:var(--c)}
.wd.rest{background:transparent}
.wd.rest .pd{border-style:dashed;border-color:var(--line)}
.wd.miss span{color:var(--bad)}
.wd.today{outline:2px solid var(--ink);outline-offset:-2px}
.wd.plan span{color:var(--muted)}
/* session */
.session-head{display:flex;gap:14px;align-items:center}
.plate{flex:none;width:54px;height:54px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--c) 70%,#000 30%)}
.plate::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg)}
.session-head h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.session-head h2 small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.notice{border-radius:12px;padding:10px 12px;font-size:13.5px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.notice.info{background:color-mix(in srgb,var(--p-blue) 10%,var(--surface));border-color:color-mix(in srgb,var(--p-blue) 35%,transparent)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec-title h3{font-size:16px;font-weight:700}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.checks li:last-child label{border-bottom:0}
.checks input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.checks .on{color:var(--muted);text-decoration:line-through}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-idx{font-family:var(--f-num);font-size:13px;color:var(--muted);padding-top:2px;min-width:18px}
.ex-head h4{font-size:16px;font-weight:700;line-height:1.35;flex:1}
.role{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;background:var(--chip)}
.role.pre{background:color-mix(in srgb,var(--p-blue) 16%,var(--surface));color:var(--p-blue)}
.role.arm{background:color-mix(in srgb,var(--p-red) 15%,var(--surface));color:var(--p-red)}
.role.abs{background:color-mix(in srgb,var(--p-green) 16%,var(--surface));color:var(--p-green)}
.role.cardio{background:color-mix(in srgb,var(--p-yellow) 20%,var(--surface));color:var(--warn)}
.ex-meta{font-size:13px;color:var(--muted)}
.tgt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tgt div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.tgt small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.tgt b{font-family:var(--f-num);font-size:14px;font-weight:600;display:block;overflow-wrap:anywhere}
.tgt .goal b{color:var(--p-blue)}
.tgt .setbest{display:block;margin-top:4px;font-size:11px;line-height:1.45;color:var(--muted);font-family:var(--f-num)}
.sets{display:flex;flex-direction:column;gap:8px}
.sets .inp label{min-width:38px}
.inp{display:flex;align-items:center;gap:8px}
.inp label{font-size:12px;color:var(--muted);font-weight:600}
.inp input{width:84px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-family:var(--f-num);text-align:right}
.inp .x{color:var(--muted)}
.tip{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.stall{font-size:12.5px;color:var(--warn);font-weight:600}
/* results */
.res{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.res:last-child{border-bottom:0}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.badge.pr{background:var(--ink);color:var(--bg)}
.badge.keep,.badge.deload{background:var(--chip);color:var(--muted)}
.badge.low,.badge.over{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
/* diet */
.date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date-nav h1{font-family:var(--f-display);font-size:24px;font-weight:400}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.macro{display:flex;flex-direction:column;gap:6px}
.macro-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.macro-top b{font-size:14px}
.macro-top span{font-family:var(--f-num);font-size:13.5px;color:var(--muted)}
.macro-top span em{font-style:normal;color:var(--ink);font-weight:600}
.bar{position:relative;height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:6px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.macro.big .bar{height:16px}
.macro-grid{display:grid;grid-template-columns:1fr;gap:14px}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:16px;cursor:pointer;font-weight:700;background:var(--surface-2)}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;max-width:100%}
textarea,select,.field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
textarea{min-height:64px;resize:vertical}
.food{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.food-name{display:flex;gap:8px}
.food-name input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.food-nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.food-nums label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.food-nums input{width:100%;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--f-num);font-size:15px;text-align:right}
.totals{font-family:var(--f-num);font-size:13.5px;display:flex;gap:12px;flex-wrap:wrap}
.advice{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.meal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal img,.meal .noimg{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2)}
.meal-body{flex:1;min-width:0}
.meal-body p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;background:var(--surface)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.seg small{display:block;font-size:11px;opacity:.75}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:12.5px;color:var(--muted);font-weight:600}
.field.full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 4px}
.kv small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.kv b{font-family:var(--f-num);font-size:15px}
/* routine tab */
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.sched div{padding:8px 2px;border-radius:8px;background:var(--surface-2)}
.sched .rest{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.prog{display:flex;flex-direction:column;gap:12px}
.prog-day h4{font-size:14px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.prog-day ol{margin:0;padding-left:20px;font-size:13.5px;color:var(--muted)}
.prog-day ol li span{color:var(--ink)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;border:0;background:transparent;padding:12px 2px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.tab i{width:22px;height:4px;border-radius:2px;background:transparent}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] i{background:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{transform:translate(-50%,8px);opacity:0}} }
</style>
</head><body>

<div class="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>도원이의 운동일지</div>
    <div class="sync" id="sync">이 기기에 저장</div>
  </header>
  <main class="view" id="view"></main>
</div>
<nav class="tabs" aria-label="메뉴"><div class="tabs-in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- 데이터: 기구 · 운동 · 프로그램 ---------- */
const EQ={db:'덤벨',bb:'바벨',sm:'스미스',mc:'머신·케이블',body:'맨몸',time:'버티기',cardio:'유산소'};
// type: w=중량×횟수, reps=횟수만, sec=초, min=분
const EX={
  pec_fly:{n:'펙덱 플라이 (플라이 머신)',eq:'mc',type:'w',tip:'팔꿈치를 살짝 굽힌 채 가슴으로 모은다. 가슴 선피로용이라 가볍게.'},
  chest_press:{n:'체스트 프레스 머신',eq:'mc',type:'w',tip:'등받이에 허리를 붙이고 견갑을 모은 채로 민다.'},
  incline_db_press:{n:'인클라인 덤벨 프레스',eq:'db',type:'w',tip:'벤치 30°. 무게는 한 손 기준.'},
  cable_cross:{n:'케이블 크로스오버',eq:'mc',type:'w',tip:'한 발 앞으로 스태거 스탠스, 허리 젖히지 않기.'},
  flat_db_fly:{n:'플랫 덤벨 플라이',eq:'db',type:'w',tip:'가슴 선피로. 내릴 때 3초.'},
  smith_incline:{n:'스미스 인클라인 프레스',eq:'sm',type:'w',tip:'스미스 바 무게 포함 총중량을 적는다.'},
  cable_lowhigh:{n:'로우 투 하이 케이블 플라이',eq:'mc',type:'w',tip:'윗가슴 수축. 복부에 힘을 주고 허리 중립.'},
  pushdown:{n:'케이블 푸시다운',eq:'mc',type:'w',arm:true,tip:'팔꿈치 고정. 반동 없이 무게를 올린다.'},
  oh_db_ext:{n:'시티드 덤벨 오버헤드 익스텐션',eq:'db',type:'w',arm:true,tip:'인클라인 벤치를 세워 등을 기댄다. 덤벨 1개를 양손으로.'},
  smith_cg:{n:'스미스 클로즈그립 벤치프레스',eq:'sm',type:'w',arm:true,tip:'어깨너비 그립. 삼두 고중량 메인.'},
  cable_oh_ext:{n:'케이블 오버헤드 익스텐션',eq:'mc',type:'w',arm:true,tip:'스태거 스탠스로 허리 꺾임 방지.'},
  straight_pd:{n:'스트레이트 암 풀다운',eq:'mc',type:'w',tip:'광배 선피로. 팔을 편 채 허벅지까지 끌어내린다.'},
  lat_pd:{n:'랫 풀다운',eq:'mc',type:'w',tip:'상체를 많이 젖히지 않는다(10~15°).'},
  cs_db_row:{n:'체스트 서포티드 덤벨 로우',eq:'db',type:'w',tip:'인클라인 벤치에 가슴을 대고 엎드려 당긴다. 허리 부담 거의 없음.'},
  seated_cable_row:{n:'시티드 케이블 로우 (듀얼 케이블)',eq:'mc',type:'w',tip:'벤치에 앉아 상체는 고정, 팔로만 당긴다. 상체 흔들기 금지.'},
  db_pullover:{n:'덤벨 풀오버',eq:'db',type:'w',tip:'광배 선피로. 벤치에 등을 대고 엉덩이는 낮추지 않는다.'},
  rev_lat_pd:{n:'언더그립 랫 풀다운',eq:'mc',type:'w',tip:'손바닥이 몸쪽, 어깨너비 그립. 팔꿈치를 옆구리로 끌어내린다.'},

/* ---------- 날짜 ---------- */
const DOW=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const today=()=>ymd(new Date());
const dowOf=s=>parse(s).getDay();
const isRest=dw=>dw===3||dw===5;
const label=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`};

/* ---------- 저장소: claude db → 없으면 이 기기 localStorage ---------- */
const LS={
  get(k){try{const v=localStorage.getItem('plate:'+k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem('plate:'+k,JSON.stringify(v))}catch(e){}}
};
let DB=null,UID=null,SAMPLE=null,IMG_OK=false;
const queues={};
function persist(key,val){
  LS.set(key,val);
  if(!DB) return;
  const ref=DB.doc(`data/users/${UID}/${key}`);
  queues[key]=(queues[key]||Promise.resolve()).then(()=>ref.set({v:val})).catch(e=>{
    console.warn('save',key,e);
    if(e&&e.code==='quota_exceeded') toast('저장 공간이 가득 찼어요. 오래된 식단 기록을 지워주세요.');
  });
}
async function dbGet(key){
  if(!DB) return {ok:false};
  try{const s=await DB.doc(`data/users/${UID}/${key}`).get();return {ok:true,exists:s.exists,v:s.exists?s.data().v:undefined}}
  catch(e){return {ok:false}}
}

async function ensureMeals(date){

/* ---------- 루틴 로직 ---------- */
const doneOn=d=>S.log.some(e=>e.date===d);
const nextAfter=s=>ORDER[(ORDER.indexOf(s)+1)%3];
function nextSplit(){const l=S.log[S.log.length-1];return l?nextAfter(l.split):'chest'}
function missedBefore(date){
  const res=[];let d=addDays(date,-1);
  for(let i=0;i<6&&!isRest(dowOf(d));i++){ if(d>=S.profile.since&&!doneOn(d)) res.push(d); d=addDays(d,-1) }
  return res;
}
function dayState(date){
  if(doneOn(date)) return {kind:'done'};
  if(S.skips.includes(date)) return {kind:'skipped'};
  if(!isRest(dowOf(date))) return {kind:'train'};
  const missed=missedBefore(date);
  if(missed.length) return {kind:'makeup',missed};
  if(S.forceTrain) return {kind:'train',forced:true};
  return {kind:'rest'};
}
function progInfo(date){
  const p=S.profile,days=Math.max(0,diffDays(p.progStart,date)),weeks=Math.floor(days/7);
  const cyc=Math.floor(weeks/p.cycleWeeks);
  const week=weeks%p.cycleWeeks+1;
  // 각 프로그램의 마지막 주는 디로드
  return {idx:(p.progBase+cyc)%PROGRAMS.length,week,deload:week===p.cycleWeeks,nextSwitch:addDays(p.progStart,(cyc+1)*p.cycleWeeks*7)};
}
const isDeload=()=>progInfo(today()).deload;
function stepUp(ex,w){
  if(ex.eq==='db') return Math.min(20,w+2);
  if(ex.eq==='bb'||ex.eq==='sm') return w+5;
  return w+Number(S.profile.machineStep||5);
}
// 기구별 무게 단위로 내림
function roundW(ex,raw){
  if(ex.eq==='db') return Math.min(20,Math.max(2,Math.floor(raw/2)*2));
  if(ex.eq==='bb') return Math.max(20,20+Math.floor((raw-20)/5)*5);
  const st=ex.eq==='sm'?5:Number(S.profile.machineStep||5);
  return Math.floor(raw/st)*st;
}
const unit=ex=>ex.type==='sec'?'초':ex.type==='min'?'분':'회';
function fmt(ex,b){
  if(!b) return '—';
  return ex.type==='w'?`${+b.w}kg × ${b.r}회`:`${b.r}${unit(ex)}`;
}
const fmtShort=(ex,s)=>ex.type==='w'?`${+s.w}kg×${s.r}`:`${s.r}${unit(ex)}`;
// 무게가 더 무겁거나, 같은 무게에서 횟수가 더 많으면 더 좋은 기록
const better=(ex,a,b)=>!b||(ex.type==='w'?(a.w>b.w||(a.w===b.w&&a.r>b.r)):a.r>b.r);
// 세트 번호별 최고 기록 (1세트는 1세트끼리, 2세트는 2세트끼리 비교)
function setBestsText(ex,rec){
  return (rec.sets||[]).map((s,i)=>s?`${i+1}세트 ${fmtShort(ex,s)}`:'').filter(Boolean).join(' · ');
}
function target(id){
  const ex=EX[id],rec=S.records[id]||{},b=rec.best;
  if(isDeload()){
    if(!b) return '가볍게';
    return ex.type==='w'?`${roundW(ex,b.w*0.7)}kg × ${repRange(id)[0]}회`:`${Math.max(1,Math.round(b.r*0.7))}${unit(ex)}`;
  }
  if(ex.type!=='w'){
    if(!b) return ex.type==='min'?'10분':ex.type==='sec'?'30초':'12회';
    if(ex.type==='min') return b.r>=15?'15분 유지':`${b.r+1}분`;
    return `${b.r+(ex.type==='sec'?5:1)}${unit(ex)}`;
  }
  const [lo,hi]=repRange(id);
  if(!b) return `${hi}회 되는 무게 찾기`;
  const top=ex.arm?12:hi;
  if(b.r>=top){
    const nw=stepUp(ex,b.w);
    if(nw===b.w) return COMPOUND.has(id)?`${b.w}kg × 12회 · 템포 느리게`:`${b.w}kg × ${b.r+1}회`;
    return `${nw}kg × ${lo}회`;
  }
  return `${b.w}kg × ${b.r+1}회`;
}
// 대근육 복합 운동 10~12회, 나머지 12~16회
const repRange=id=>COMPOUND.has(id)?[10,12]:[12,16];
// sets: 세트 순서대로 {w,r}, 비운 세트는 null
function evaluate(id,sets,date){
  const ex=EX[id],rec=S.records[id]=S.records[id]||{},hi=repRange(id)[1];
  sets=sets.map(s=>s&&{w:ex.type==='w'?s.w:0,r:COMPOUND.has(id)?Math.min(s.r,hi):s.r});
  rec.sets=rec.sets||[];
  let pr=false;
  sets.forEach((s,i)=>{if(s&&better(ex,s,rec.sets[i])){rec.sets[i]={...s,date};pr=true}});
  for(let i=0;i<rec.sets.length;i++) if(rec.sets[i]===undefined) rec.sets[i]=null;
  const top=sets.reduce((a,s)=>s&&(!a||better(ex,s,a))?s:a,null);
  if(better(ex,top,rec.best)){rec.best={...top,date};pr=true}
  rec.stall=pr?0:(rec.stall||0)+1;
  return {id,sets,w:top.w,r:top.r,status:pr?'pr':'keep'};
}

/* ---------- 식단 로직 ---------- */
function targets(p=S.profile){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.activity;
  const kcal=Math.round(tdee*GOALS[p.goal].kcal/10)*10+(p.kcalAdj||0);
  const protein=Math.round(p.weight*Math.max(1.5,p.pmult));
  const pmin=Math.round(p.weight*1.5);
  const fat=Math.round(kcal*0.25/9);
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {kcal,protein,pmin,fat,carbs,tdee:Math.round(tdee)};
}
const n0=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
function sumFoods(foods){
  return foods.reduce((a,f)=>({kcal:a.kcal+n0(f.kcal),p:a.p+n0(f.protein),c:a.c+n0(f.carbs),f:a.f+n0(f.fat)}),{kcal:0,p:0,c:0,f:0});
}
function dayTotals(date){
  const m=S.meals[date];const t={kcal:0,p:0,c:0,f:0};
  if(m) for(const it of m.items){const s=sumFoods(it.foods);t.kcal+=s.kcal;t.p+=s.p;t.c+=s.c;t.f+=s.f}
  return t;
}
const r1=v=>Math.round(v*10)/10;

/* ---------- 체중 추세 ---------- */
// 목표별 적정 체중 변화 (kg/주)
const RATE={bulk:[0.2,0.5],lean:[0.05,0.25],diet:[-0.8,-0.25]};
const lastWeigh=()=>S.weights[S.weights.length-1]||null;
function weighDue(){const l=lastWeigh();return !l||diffDays(l.date,today())>=7}
function weightTrend(){
  const w=S.weights;if(w.length<3) return null;
  const last=w[w.length-1];let base=null;
  for(let i=w.length-2;i>=0;i--) if(diffDays(w[i].date,last.date)>=13){base=w[i];break}
  if(!base) return null;
  return {rate:(last.kg-base.kg)/(diffDays(base.date,last.date)/7),last,base};
}
function kcalAlert(){
  const t=weightTrend();if(!t||S.profile.adjAt===t.last.date) return null;
  const g=S.profile.goal,[lo,hi]=RATE[g],rt=`최근 ${label(t.base.date)}부터 주 ${t.rate>=0?'+':''}${r1(t.rate)}kg`;
  if(t.rate<lo) return {delta:150,msg:g==='diet'?`체중이 너무 빨리 빠지고 있어요 (${rt}). 근손실을 막으려면 하루 150kcal를 늘리세요.`:`체중이 정체돼 있어요 (${rt}). ${GOALS[g].name}을 위해 하루 150kcal를 늘리세요.`};
  if(t.rate>hi) return {delta:-150,msg:g==='diet'?`감량이 정체돼 있어요 (${rt}). 하루 150kcal를 줄이세요.`:`체중이 너무 빨리 늘고 있어요 (${rt}). 지방이 붙지 않게 하루 150kcal를 줄이세요.`};
  return null;
}
function spark(){
  const w=S.weights.slice(-8);if(w.length<2) return '';
  const xs=w.map(x=>x.kg),mn=Math.min(...xs),mx=Math.max(...xs),rg=Math.max(0.5,mx-mn),W=300,H=60,P=6;
  const pts=w.map((x,i)=>[P+i*(W-2*P)/(w.length-1),P+(1-(x.kg-mn)/rg)*(H-2*P)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),e=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="최근 체중 추이"><polygon points="${pts[0][0]},${H} ${line} ${e[0]},${H}" fill="var(--p-blue)" opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--p-blue)" stroke-width="2" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="4" fill="var(--p-blue)"/></svg>
  <div class="row small muted num" style="justify-content:space-between"><span>${w[0].date.slice(5)} · ${w[0].kg}kg</span><span>${w[w.length-1].date.slice(5)} · ${w[w.length-1].kg}kg</span></div>`;
}
function weightCard(){
  const l=lastWeigh(),due=weighDue(),al=kcalAlert(),t=weightTrend();
  return `<div class="card stack"><div class="sec-title"><h3>주간 체중</h3><span class="small muted">${l?`${label(l.date)} · ${l.kg}kg`:'기록 없음'}</span></div>
    ${due?`<div class="inp"><label for="wt-in">오늘 체중</label><input id="wt-in" type="number" inputmode="decimal" step="0.1" placeholder="kg"><button class="btn sm" data-act="saveweight">기록</button></div>
      <p class="small muted" style="margin:0">일주일에 한 번, 아침 공복에 화장실 다녀온 뒤 재세요.</p>`
      :`<p class="small muted" style="margin:0">다음 측정일 ${label(addDays(l.date,7))}${t?` · 2주 추세 주 ${t.rate>=0?'+':''}${r1(t.rate)}kg`:''}</p>`}
    ${spark()}
    ${al?`<div class="notice">${al.msg}<div class="row" style="margin-top:8px"><button class="btn sm" data-act="applyadj" data-d="${al.delta}">목표 칼로리 ${al.delta>0?'+':''}${al.delta}kcal 적용</button><button class="btn sm ghost" data-act="dismissadj">이번엔 유지</button></div></div>`:''}
  </div>`;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function weekStrip(){
  const t=today(),mon=addDays(t,-((dowOf(t)+6)%7)),st=dayState(t);
  let cur=nextSplit();
  const cells=[];
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),dw=dowOf(d),e=S.log.find(x=>x.date===d);
    let cls='',lab='',c='';
    if(e){cls='done';lab=SPLITS[e.split].short;c=SPLITS[e.split].c}
    else if(S.skips.includes(d)){cls='miss';lab='미룸'}
    else if(d<t){ if(isRest(dw)){cls='rest';lab='휴식'} else if(d>=S.profile.since){cls='miss';lab='놓침'} else {lab='–'} }
    else if(d===t){ if(st.kind!=='rest'){cls='plan';lab=SPLITS[cur].short;c=SPLITS[cur].c;cur=nextAfter(cur)} else {cls='rest';lab='휴식'} }
    else{ if(isRest(dw)){cls='rest';lab='휴식'} else {cls='plan';lab=SPLITS[cur].short;c=SPLITS[cur].c;cur=nextAfter(cur)} }
    if(d===t) cls+=' today';
    cells.push(`<div class="wd ${cls}" style="${c?`--c:${c}`:''}"><b>${DOW[dw]}</b><div class="pd"></div><span>${lab}</span></div>`);
  }
  return `<div class="week" aria-label="이번 주 일정">${cells.join('')}</div>`;
}

function vToday(){
  const t=today(),st=dayState(t),pi=progInfo(t),p=S.profile,tg=targets(),eat=dayTotals(t);
  let h=`<div class="h-date"><h1>${label(t)}</h1><span class="chip">${PROGRAMS[pi.idx].name} · ${pi.deload?'디로드 주간':`${pi.week}/${p.cycleWeeks}주`}</span></div>`;
  if(!p.configured) h+=`<div class="notice info">체중·목표를 먼저 입력하면 단백질 목표와 칼로리가 맞춰집니다. 지금은 예시값(70kg, 린매스업)이에요. <button class="btn sm ghost" data-act="tab" data-k="settings" style="margin-top:8px">내 정보 입력</button></div>`;
  h+=weekStrip();

function sessionView(split,prog,st){

  if(last&&!S.editing){const g=diffDays(last.date,today());if(g<3) warn=`<div class="notice">마지막 ${sp.name} 운동 후 ${g*24}시간 정도 지났어요. 72시간 회복을 권장합니다. 가능하면 내일로 미루세요.</div>`}
  const editing=!!S.editing;
  const makeup=editing?`<div class="notice info">오늘 완료한 기록을 수정하는 중이에요. 값을 고친 뒤 <b>수정 저장</b>을 누르세요. 최고 기록도 수정한 값으로 다시 계산돼요.</div>`
    :st.kind==='makeup'?`<div class="notice info">보충 운동일: ${st.missed.map(d=>label(d)).join(', ')}에 운동을 못 해서 오늘 합니다.</div>`:'';

function exCard(id,role,sets,i){
  const ex=EX[id],rec=S.records[id]||{};

  const reps=ex.type==='sec'?'30~60초':ex.type==='min'?'10~15분':`${lo}~${hi}회${COMPOUND.has(id)?' (최대 12회)':''}`;
  const rest=role==='cardio'?'':role==='arm'?' · 휴식 90초':' · 휴식 60~90초';
  if(isDeload()) sets=Math.max(1,sets-1);
  // 세트마다 무게 × 횟수 입력. 빈칸 안의 흐린 숫자는 그 세트의 최고 기록
  const rows=[];
  for(let k=0;k<sets;k++){
    const v=draftSet(id,k),pb=(rec.sets||[])[k];
    rows.push(ex.type==='w'
      ?`<div class="inp"><label for="w-${id}-${k}">${k+1}세트</label><input id="w-${id}-${k}" data-val="${id}" data-s="${k}" data-f="w" type="number" inputmode="decimal" step="any" placeholder="${pb?+pb.w:''}kg" value="${esc(v.w??'')}"><span class="x">×</span><input id="r-${id}-${k}" data-val="${id}" data-s="${k}" data-f="r" type="number" inputmode="numeric" placeholder="${pb?pb.r:''}회" value="${esc(v.r??'')}"></div>`
      :`<div class="inp"><label for="r-${id}-${k}">${sets>1?`${k+1}세트`:ex.type==='sec'?'버틴 시간':ex.type==='min'?'운동 시간':'횟수'}</label><input id="r-${id}-${k}" data-val="${id}" data-s="${k}" data-f="r" type="number" inputmode="numeric" placeholder="${pb?pb.r:''}${unit(ex)}" value="${esc(v.r??'')}"></div>`);
  }
  const stall=(rec.stall||0)>=2&&rec.best?`<div class="stall">${rec.stall}회 연속 갱신 실패 → 이전 기록 ${fmt(ex,rec.best)}으로 반복하세요.</div>`:'';
  const perSet=setBestsText(ex,rec);
  return `<article class="ex">
    <div class="ex-head"><span class="ex-idx">${i}</span><h4>${esc(ex.n)}</h4><span class="role ${role}">${ROLE[role]}</span></div>

    ${stall}<div class="sets">${rows.join('')}</div>
    <div class="tip">${esc(ex.tip)}</div>
  </article>`;
}

  if(!canAsk) h+=`<p class="small muted" style="margin:0">설정에서 무료 Gemini 키를 한 번만 넣으면 사진을 찍는 즉시 탄수화물·단백질·지방이 자동 계산돼요. 지금은 직접 입력만 됩니다. <button class="btn sm ghost" data-act="tab" data-k="settings" style="margin-top:6px">무료 키 넣기</button></p>`;
  else h+=`<p class="small muted" style="margin:0">사진을 넣거나, 먹은 음식을 적고 엔터(또는 키보드 닫기)를 누르면 자동으로 계산돼요. 제품명·개수·양을 적을수록 정확해요.</p>`;
  h+=`<div class="row">${canAsk?`<button class="btn" style="flex:2" data-act="analyze" ${S.busy?'disabled':''}>${S.busy?'분석 중…':S.analysis&&S.photoUrl?'다시 분석':'영양 분석'}</button>`:''}<button class="btn ghost" style="flex:1" data-act="manual">직접 입력</button></div>`;
  if(S.status) h+=`<p class="small muted" style="margin:0" id="an-status">${esc(S.status)}</p>`;
  if(a){
    h+=`<div class="stack">${a.foods.map((f,i)=>`<div class="food">
      <div class="food-name"><input id="fn-${i}" data-food="${i}" data-f="name" value="${esc(f.name)}" aria-label="음식 이름"><button class="icon-btn" data-act="delfood" data-i="${i}" aria-label="삭제">×</button></div>
      <div class="food-nums">${[['grams','g'],['kcal','kcal'],['protein','단백'],['carbs','탄수'],['fat','지방']].map(([k,l])=>`<label>${l}<input id="f${k}-${i}" data-food="${i}" data-f="${k}" type="number" inputmode="decimal" step="any" value="${esc(f[k])}"></label>`).join('')}</div></div>`).join('')}
      <button class="btn sm ghost" data-act="addfood">+ 음식 추가</button>
      <div class="totals" id="an-total">${totalsText(sumFoods(a.foods))}</div>
      ${a.advice?`<div class="advice">${esc(a.advice)}${a.confidence?`<div class="small muted" style="margin-top:4px">추정 신뢰도: ${{high:'높음',medium:'보통',low:'낮음'}[a.confidence]||esc(a.confidence)} · 숫자는 직접 고칠 수 있어요</div>`:''}</div>`:''}
      <div class="row"><button class="btn" style="flex:2" data-act="savemeal">이 식사 저장</button><button class="btn ghost" style="flex:1" data-act="cancelmeal">취소</button></div></div>`;
  }
  return h+'</div>';
}
const totalsText=s=>`<span>${Math.round(s.kcal)}kcal</span><span>단백질 ${r1(s.p)}g</span><span>탄수 ${r1(s.c)}g</span><span>지방 ${r1(s.f)}g</span>`;
function mealRow(it){
  const s=sumFoods(it.foods),conf=S.confirm==='meal'+it.id;

  const sched=[1,2,3,4,5,6,0].map(d=>`<div class="${isRest(d)?'rest':''}"><b>${DOW[d]}</b><br>${isRest(d)?'휴식·보충':'운동'}</div>`).join('');
  const progs=PROGRAMS.map((P,k)=>`<div class="card prog"><div class="sec-title"><h3>${P.name}</h3>${k===pi.idx?`<span class="chip dot" style="--c:var(--ok)">진행 중 · ${pi.week}주차</span>`:`<span class="small muted">${k===(pi.idx+1)%PROGRAMS.length?label(pi.nextSwitch)+' 시작':''}</span>`}</div>
    ${ORDER.map(s=>`<div class="prog-day"><h4><span class="chip dot" style="--c:${SPLITS[s].c}">${SPLITS[s].name}</span></h4><ol>${P.days[s].map(([id,role])=>`<li><span>${esc(EX[id].n)}</span> · ${ROLE[role]}</li>`).join('')}</ol></div>`).join('')}</div>`).join('');

  <div class="card"><h3 style="font-size:16px;margin-bottom:10px">운동 원칙</h3><ol class="rules">
    <li>점진적 과부하: 범위 상단 횟수를 채우면 다음 무게로, 아니면 같은 무게로 1회 더.</li>
    <li>대근육 복합 운동(프레스·로우·풀다운·레그 프레스 등)은 10~12회(최대 12회).</li>

    <li>복근은 가슴·등 날에 한 종목 3세트. 삼두는 가슴 날, 이두는 등 날.</li>
    <li>같은 부위는 72시간 휴식.</li>
    <li>세트마다 무게·횟수를 기록하고, 세트별 최고 기록을 넘기지 못하면 이전 기록으로 반복.</li>
    <li>회식 등으로 못 한 운동은 다음 날 이어서 하고, 일정은 하루씩 밀립니다.</li>
    <li>허리 보호를 위해 스쿼트·데드리프트와 상체를 숙인 바벨 로우는 제외했어요.</li>
    <li>${S.profile.cycleWeeks}주마다 프로그램 A → B → C 순서로 교체. 각 프로그램의 마지막 주는 디로드(무게 70%, 세트 −1).</li>
  </ol></div>${progs}`;
}

/* ---------- 이벤트 ---------- */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
let confT;
function armConfirm(key){S.confirm=key;clearTimeout(confT);confT=setTimeout(()=>{if(S.confirm===key){S.confirm=null;render()}},4000)}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b) return;
  const act=b.dataset.act;
  if(act==='tab'){S.tab=b.dataset.k;S.confirm=null;if(S.tab==='diet') await ensureMeals(S.mealDate);render();window.scrollTo(0,0);return}
  if(act==='force'){S.forceTrain=true;render();return}
  if(act==='skip'){const d=today();if(!S.skips.includes(d)) S.skips.push(d);S.skips=S.skips.slice(-60);S.forceTrain=false;persist('skips',S.skips);render();window.scrollTo(0,0);toast('내일 이어서 합니다');return}
  if(act==='unskip'){S.skips=S.skips.filter(x=>x!==today());persist('skips',S.skips);render();return}
  if(act==='saveweight'){
    const v=parseFloat((document.getElementById('wt-in')||{}).value);
    if(!(v>=30&&v<=250)){toast('체중을 kg 단위로 입력하세요');return}
    const d=today();S.weights=S.weights.filter(x=>x.date!==d);S.weights.push({date:d,kg:r1(v)});
    S.weights.sort((a,b)=>a.date<b.date?-1:1);S.weights=S.weights.slice(-104);
    S.profile.weight=r1(v);S.profile.configured=true;
    persist('weights',S.weights);persist('profile',S.profile);render();toast(`${r1(v)}kg 기록했어요`);return;
  }
  if(act==='applyadj'){const t=weightTrend();S.profile.kcalAdj=(S.profile.kcalAdj||0)+Number(b.dataset.d);S.profile.adjAt=t?t.last.date:today();persist('profile',S.profile);render();toast(`목표 칼로리 ${targets().kcal}kcal로 조정했어요`);return}
  if(act==='dismissadj'){const t=weightTrend();S.profile.adjAt=t?t.last.date:today();persist('profile',S.profile);render();return}
  if(act==='resetadj'){S.profile.kcalAdj=0;persist('profile',S.profile);render();return}
  if(act==='editdone'){startEdit();window.scrollTo(0,0);return}
  if(act==='canceledit'){cancelEdit();window.scrollTo(0,0);return}
  if(act==='finish'){
    if(S.confirm!=='finish'){armConfirm('finish');render();return}
    S.confirm=null;finishSession(b.dataset.split,+b.dataset.prog,b.dataset.makeup==='1');return;
  }
  if(act==='mday'){const d=addDays(S.mealDate,+b.dataset.n);if(d>today()) return;S.mealDate=d;await ensureMeals(d);render();return}
  if(act==='clearphoto'){S.photo=null;S.photoUrl=null;render();return}
  if(act==='manual'){S.analysis={foods:[{name:'',grams:'',kcal:'',protein:'',carbs:'',fat:''}],advice:'',confidence:''};S.status='';render();return}
  if(act==='addfood'){S.analysis.foods.push({name:'',grams:'',kcal:'',protein:'',carbs:'',fat:''});render();return}
  if(act==='delfood'){S.analysis.foods.splice(+b.dataset.i,1);render();return}
  if(act==='cancelmeal'){resetComposer();render();return}
  if(act==='analyze'){analyze();return}
  if(act==='savemeal'){saveMeal();return}
  if(act==='delmeal'){
    const id=b.dataset.id;
    if(S.confirm!=='meal'+id){armConfirm('meal'+id);render();return}
    S.confirm=null;const m=S.meals[S.mealDate];m.items=m.items.filter(x=>x.id!==id);persist('meals-'+S.mealDate,m);render();toast('식사를 지웠어요');return;
  }
  if(act==='switchprog'){
    const pi=progInfo(today());S.profile.progBase=(pi.idx+1)%PROGRAMS.length;S.profile.progStart=today();persist('profile',S.profile);render();toast(`${PROGRAMS[S.profile.progBase].name}로 바꿨어요`);return;
  }
  if(act==='savekey'){
    const v=((document.getElementById('api-key')||{}).value||'').trim();
    // 키 형식은 AIza...(예전)와 AQ....(새 형식) 등이 있어 모양만 느슨하게 확인. 진짜 검증은 첫 분석 때 Google이 함
    if(v.length<20||/\s/.test(v)){toast('Gemini API 키를 빈칸 없이 그대로 붙여넣어주세요');return}
    try{localStorage.setItem(KEY_STORE,v);localStorage.removeItem(MODEL_STORE);localStorage.removeItem(AUTH_STORE);localStorage.removeItem('plate-secret:apikey')}catch(e){}
    S.keyTest='';
    render();toast('API 키를 저장했어요');return;
  }
  if(act==='delkey'){try{localStorage.removeItem(KEY_STORE)}catch(e){}render();toast('API 키를 지웠어요');return}
  if(act==='testkey'){testKey();return}
  if(act==='export'){exportBackup();return}
  if(act==='reset'){
    if(S.confirm!=='reset'){armConfirm('reset');render();return}
    S.confirm=null;S.editing=null;S.records={};S.log=[];S.profile.since=today();persist('records',S.records);persist('log',S.log);persist('profile',S.profile);render();toast('운동 기록을 초기화했어요');return;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.val){
    const id=el.dataset.val,k=+el.dataset.s;S.draft.date=today();
    const v=S.draft.vals[id]=S.draft.vals[id]||{};
    if(!v.sets){v.sets=v.w!=null||v.r!=null?[{w:v.w,r:v.r}]:[];delete v.w;delete v.r}
    (v.sets[k]=v.sets[k]||{})[el.dataset.f]=el.value;saveDraft();return;
  }
  if(el.dataset.food!=null){S.analysis.foods[+el.dataset.food][el.dataset.f]=el.value;const t=document.getElementById('an-total');if(t) t.innerHTML=totalsText(sumFoods(S.analysis.foods));return}
  if(el.id==='meal-memo'){S.memo=el.value;return}
});
// 메모 칸에서 엔터 = 입력 끝 (키보드를 닫으면 change 이벤트로 자동 분석). 한글 조합 중 엔터는 무시
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(el.id==='meal-memo'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();el.blur()}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.chk){S.draft.date=today();S.draft.checks[el.dataset.chk]=el.checked;saveDraft();el.nextElementSibling.classList.toggle('on',el.checked);return}
  if(el.id==='meal-label'){S.mealLabel=el.value;return}
  if(el.id==='meal-memo'){S.memo=el.value;autoAnalyze();return}
  if(el.id==='import-file'&&el.files&&el.files[0]){importBackup(el.files[0]);el.value='';return}
  if(el.id==='meal-photo'&&el.files&&el.files[0]){
    S.photo=el.files[0];S.photoUrl=await readDataUrl(S.photo);el.value='';
    if(apiKey()){analyze();return}
    S.status='무료 Gemini 키가 없어서 자동 계산을 못 했어요. 아래에 직접 입력하거나 설정에서 키를 넣어주세요.';
    if(!S.analysis) S.analysis={foods:[{name:'',grams:'',kcal:'',protein:'',carbs:'',fat:''}],advice:'',confidence:''};
    render();return;
  }

    p.configured=true;persist('profile',p);render();

function finishSession(split,prog,makeup){
  const d=today(),results=[],deload=isDeload(),before={};
  // 나중에 이 기록을 수정할 수 있도록, 바뀌기 전 최고 기록을 같이 저장
  for(const [id] of PROGRAMS[prog].days[split]) before[id]=S.records[id]?JSON.parse(JSON.stringify(S.records[id])):null;
  for(const [id,,n] of PROGRAMS[prog].days[split]){
    const ex=EX[id],cnt=deload?Math.max(1,n-1):n,sets=[];
    for(let k=0;k<cnt;k++){
      const v=draftSet(id,k),w=parseFloat(v.w),r=parseInt(v.r,10);
      sets.push((ex.type==='w'?w>0&&r>0:r>0)?{w:ex.type==='w'?w:0,r}:null);
    }
    if(!sets.some(Boolean)) continue;
    // 디로드 주간은 최고 기록을 건드리지 않는다
    if(deload){const top=sets.reduce((a,s)=>s&&(!a||better(ex,s,a))?s:a,null);results.push({id,sets,w:top.w,r:top.r,status:'deload'})}
    else results.push(evaluate(id,sets,d));
  }
  const wasEditing=!!S.editing;S.editing=null;
  S.log.push({date:d,split,prog,makeup,deload,results,before});
  if(S.log.length>400) S.log=S.log.slice(-400);
  S.draft={date:d,vals:{},checks:{}};saveDraft();
  S.forceTrain=false;
  persist('log',S.log);persist('records',S.records);
  render();window.scrollTo(0,0);
  toast(`${wasEditing?'수정했어요':'저장했어요'} · 신기록 ${results.filter(r=>r.status==='pr').length}개`);
}

// 저장된 운동 기록만으로 특정 운동의 최고 기록을 처음부터 다시 계산 (예전 기록에 스냅샷이 없을 때)
function rebuildRecords(ids,log){
  for(const id of ids) delete S.records[id];
  for(const e of log){
    if(e.deload) continue;
    for(const r of e.results) if(ids.includes(r.id)) evaluate(r.id,r.sets||[{w:r.w,r:r.r}],e.date);
  }
}
function startEdit(){
  let idx=-1;for(let i=S.log.length-1;i>=0;i--) if(S.log[i].date===today()){idx=i;break}
  if(idx<0) return;
  const entry=S.log[idx];
  // 취소하면 그대로 되돌릴 수 있게 지금 상태를 보관 (수정 저장 전까지는 기기에 저장하지 않음)
  S.editing={entry,idx,records:JSON.parse(JSON.stringify(S.records)),draft:S.draft};
  S.log.splice(idx,1);
  if(entry.before){for(const [id,v] of Object.entries(entry.before)){if(v) S.records[id]=JSON.parse(JSON.stringify(v));else delete S.records[id]}}
  else rebuildRecords(PROGRAMS[entry.prog].days[entry.split].map(([id])=>id),S.log);
  // 저장했던 세트 값을 입력 칸에 다시 채움
  S.draft={date:today(),vals:{},checks:{}};
  for(const r of entry.results){
    const sets=r.sets||[{w:r.w,r:r.r}];
    S.draft.vals[r.id]={sets:sets.map(x=>x?{w:EX[r.id].type==='w'?String(x.w):'',r:String(x.r)}:{})};
  }
  S.confirm=null;render();
}
function cancelEdit(){
  const ed=S.editing;if(!ed) return;
  S.log.splice(ed.idx,0,ed.entry);S.records=ed.records;S.draft=ed.draft;S.editing=null;S.confirm=null;
  render();toast('원래 기록을 유지했어요');
}

const ERR={offline:'인터넷에 연결되지 않았어요. Wi-Fi나 LTE를 켜고 다시 눌러주세요. 직접 입력은 오프라인에서도 돼요.',blocked:'인터넷은 연결돼 있는데 Google 서버의 응답을 받지 못했어요(Google이 이 키의 요청을 거부했을 수 있어요). 설정 → 키 확인을 눌러 나오는 문구를 확인해주세요.',timeout:'Gemini가 너무 오래 응답하지 않아요. 인터넷 상태를 확인하고 다시 눌러주세요.',bad_key:'Gemini API 키가 올바르지 않아요. 설정에서 키를 확인해주세요.',aq_unsupported:'Google이 이 키(AQ.로 시작하는 새 형식)로 하는 호출을 거부했어요. 설정 → 키 확인으로 다시 확인하고, 안 되면 AI Studio에서 키를 새로 만들어보세요.',quota_zero:'이 키의 무료 사용 한도가 0으로 잡혀 있어요(Google 쪽 계정 설정 문제). AI Studio에서 새 프로젝트로 키를 다시 만들어보세요.',rate_limited:'무료 사용량을 잠시 다 썼어요. 1분쯤 뒤에(하루 한도라면 내일) 다시 눌러주세요.',overloaded:'Gemini 서버가 바빠요. 잠시 후 다시 눌러주세요.',no_model:'이 키로 쓸 수 있는 Gemini 모델을 찾지 못했어요. 키를 새로 발급해보세요.',image_rejected:'사진을 읽지 못했어요. 다른 사진(JPEG/PNG)을 골라주세요.',invalid_json:'분석 결과를 읽지 못했어요. 다시 눌러주세요.',refused:'이 사진은 분석할 수 없어요. 음식이 잘 보이는 사진으로 다시 시도하세요.'};
const errText=e=>(ERR[e&&e.code]||'분석에 실패했어요. 잠시 후 다시 눌러주세요.')+(e&&e.message?` (Google: ${String(e.message).slice(0,180)})`:'');
/* Google Gemini 무료 API (aistudio.google.com 에서 카드 등록 없이 발급) */
const GEM='https://generativelanguage.googleapis.com/v1beta/';
const MODEL_STORE='plate-secret:gemini-model',AUTH_STORE='plate-secret:gemini-auth';
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
// 한 번의 요청: 시간 제한을 두고, 키 전달 방식은 3가지
//  header: x-goog-api-key 헤더 / query: 주소의 ?key= / simple: ?key= + text/plain (브라우저 사전 확인 요청 없음)
async function gemFetchOnce(path,body,ms,mode){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms);
  const url=GEM+path+(mode!=='header'?(path.includes('?')?'&':'?')+'key='+encodeURIComponent(apiKey()):'');
  const headers={};
  if(body) headers['content-type']=mode==='simple'?'text/plain;charset=UTF-8':'application/json';
  if(mode==='header') headers['x-goog-api-key']=apiKey();
  let resp;
  try{resp=await fetch(url,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,signal:ctl.signal})}
  catch(e){
    if(ctl.signal.aborted) throw {code:'timeout'};
    if(navigator.onLine===false) throw {code:'offline'};
    // 연결은 돼 있는데 실패 = 서버가 거부한 응답을 브라우저가 막은 경우가 대부분 → 다른 방식으로 재시도
    throw {code:'blocked',auth:true};
  }
  finally{clearTimeout(timer)}
  const j=await resp.json().catch(()=>null);
  if(!resp.ok){
    const err=(j&&j.error)||{},msg=String(err.message||`HTTP ${resp.status}`),st=String(err.status||''),all=msg+' '+JSON.stringify(err.details||'');
    if(/ACCESS_TOKEN_TYPE_UNSUPPORTED|OAuth 2 access token/i.test(all)) throw {code:'aq_unsupported',auth:true,message:msg};
    if(resp.status===429||st==='RESOURCE_EXHAUSTED') throw {code:/limit:?\s*0\b/i.test(all)?'quota_zero':'rate_limited',status:429,message:msg};
    if(/api.?key/i.test(msg)||resp.status===401||resp.status===403) throw {code:'bad_key',auth:true,message:msg};
    if(resp.status===404) throw {code:'no_model',status:404,message:msg};
    if(resp.status>=500) throw {code:'overloaded',status:resp.status,message:msg};
    if(/thinking/i.test(msg)) throw {code:'api',thinking:true,status:400,message:msg};
    if(/image|inline_data/i.test(msg)) throw {code:'image_rejected',message:msg};
    throw {code:'api',message:msg,status:resp.status};
  }
  return j;
}
// 인증 오류가 나면 다른 전달 방식으로 한 번 더 시도하고, 되는 방식을 기억한다
async function gemFetch(path,body,ms){
  const saved=lsGet(AUTH_STORE),modes=['header','query','simple'].filter(m=>body||m!=='simple').sort((a,b)=>(b===saved)-(a===saved));
  const errs=[];
  for(const mode of modes){
    try{const j=await gemFetchOnce(path,body,ms,mode);lsSet(AUTH_STORE,mode);return j}
    catch(e){errs.push(e);if(!e.auth&&!(mode==='simple'&&e.code==='api')) throw e}
  }
  // 모두 실패: Google이 이유를 알려준 오류를 우선 보여준다
  throw errs.find(e=>e.message&&e.code!=='api')||errs.find(e=>e.code!=='api')||errs[0];
}
// 모델 이름은 자주 바뀌므로, 이 키로 쓸 수 있는 모델 목록에서 최신 Flash 모델을 고른다
const verOf=n=>{const m=n.match(/gemini-(\d+)(?:\.(\d+))?/);return m?+m[1]+(m[2]?+m[2]/10:0):0};
async function pickModels(){
  const j=await gemFetch('models?pageSize=1000',null,20000);
  const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>String(m.name).replace(/^models\//,''))
    .filter(n=>/flash/.test(n)&&!/image|tts|audio|live|embed|thinking|robotics|computer|8b/i.test(n));
  const score=n=>(n==='gemini-flash-latest'?1000:0)+(/lite/.test(n)?-50:0)+(/preview|exp/.test(n)?-20:0)+verOf(n)*10;
  return names.sort((a,b)=>score(b)-score(a)).slice(0,4);
}
function parseGemini(j){
  if(j.promptFeedback&&j.promptFeedback.blockReason) throw {code:'refused'};
  const c=(j.candidates||[])[0];
  if(!c||/SAFETY|PROHIBITED|BLOCKLIST/.test(c.finishReason||'')) throw {code:'refused'};
  const text=((c.content||{}).parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
  const m=text.replace(/```(?:json)?/g,'').match(/\{[\s\S]*\}/);
  try{return JSON.parse(m?m[0]:text)}catch(e){throw {code:'invalid_json'}}
}
// 음식 사진 분석은 깊게 생각할 필요가 없어서 생각(thinking)을 줄여 응답을 빠르게
function speedConfig(m){
  if(/gemini-2\.5-flash/.test(m)) return {thinkingConfig:{thinkingBudget:0}};
  if(/gemini-[3-9]/.test(m)) return {thinkingConfig:{thinkingLevel:'low'}};
  return {};
}
// 큰 사진은 긴 변 1024px JPEG로 줄여서 보낸다 (LTE 데이터 절약 · 빠른 응답)
function jpegBase64(dataUrl){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.82);res(d.slice(d.indexOf(',')+1))};img.onerror=()=>rej({code:'image_rejected'});img.src=dataUrl})}
async function askGemini(prompt,dataUrl,step=()=>{}){
  if(navigator.onLine===false) throw {code:'offline'};
  step('사진 준비 중');
  const parts=[];
  if(dataUrl) parts.push({inline_data:{mime_type:'image/jpeg',data:await jpegBase64(dataUrl)}});
  parts.push({text:prompt});
  let saved=lsGet(MODEL_STORE),list=saved?[saved]:[],lastErr=null;
  for(let pass=0;pass<2;pass++){
    if(!list.length){step('사용할 Gemini 모델 찾는 중');list=await pickModels();if(!list.length) throw {code:'no_model'}}
    for(const m of list){
      let gc={responseMimeType:'application/json',temperature:0.2,...speedConfig(m)};
      for(let t=0;t<2;t++){
        try{
          step(`${m}로 분석 중`);
          const j=await gemFetch(`models/${encodeURIComponent(m)}:generateContent`,{contents:[{role:'user',parts}],generationConfig:gc},60000);
          lsSet(MODEL_STORE,m);
          return parseGemini(j);
        }catch(e){
          lastErr=e;
          // 생각 설정을 모르는 모델이면 설정을 빼고 한 번 더
          if(e.thinking&&gc.thinkingConfig){gc={responseMimeType:'application/json',temperature:0.2};continue}
          break;
        }
      }
      // 없어진 모델·한도 초과·서버 오류·시간 초과면 다음 모델로, 그 외(키 오류 등)는 바로 중단
      if(!(lastErr.status===404||lastErr.status===429||lastErr.status>=500||lastErr.code==='timeout')) throw lastErr;
    }
    if(!saved) break;
    saved='';list=[];lsSet(MODEL_STORE,'');
  }
  throw lastErr||{code:'no_model'};
}

confidence는 high, medium, low 중 하나. 음식이 보이지 않으면 foods는 빈 배열로 두고 advice에 이유를 적으세요.`;

  const lab=document.getElementById('meal-label');
  const now=new Date();
  const item={id:Date.now().toString(36),label:lab?lab.value:guessLabel(),time:S.mealDate===today()?`${pad(now.getHours())}:${pad(now.getMinutes())}`:'',foods,advice:a.advice||'',thumb:await makeThumb(S.photoUrl)};
  const m=await ensureMeals(S.mealDate);
  m.items.push(item);
  persist('meals-'+S.mealDate,m);
  resetComposer();S.mealLabel=null;render();
  const s=sumFoods(foods);toast(`저장했어요 · 단백질 ${r1(s.p)}g`);
}

/* ---------- 백업 · 복원 (API 키는 제외) ---------- */
async function exportBackup(){
  const data={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('plate:')) data[k]=localStorage.getItem(k)}}catch(e){}
  const blob=new Blob([JSON.stringify({app:'plate',version:1,exported:new Date().toISOString(),data})],{type:'application/json'});
  const name=`workout-backup-${today()}.json`;
  // 휴대폰에서는 공유 시트(파일 앱·드라이브·카톡 등)로, 안 되면 다운로드
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'운동일지 백업'});return}
  }catch(e){if(e&&e.name==='AbortError') return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('백업 파일을 저장했어요');
}
async function importBackup(file){
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.app!=='plate'||typeof j.data!=='object') throw 0;
    const keys=Object.keys(j.data).filter(k=>k.startsWith('plate:'));
    if(!keys.length) throw 0;
    for(const k of keys) localStorage.setItem(k,String(j.data[k]));
    toast('백업을 불러왔어요');setTimeout(()=>location.reload(),600);
  }catch(e){toast('운동일지 백업 파일이 아니에요')}
}

// 오프라인 실행용 서비스 워커
if('serviceWorker' in navigator){
  // 새 버전이 설치되면 한 번만 자동으로 새로고침
  const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl&&!reloaded){reloaded=true;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    // 앱을 다시 열 때마다 새 버전 확인
    document.addEventListener('visibilitychange',()=>{if(!document.hidden) r.update().catch(()=>{})});
  }).catch(e=>console.warn('sw',e)));
}
// 앱을 켜둔 채 날짜가 바뀌면 오늘 화면을 다시 그린다
let lastDay=today();
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||today()===lastDay) return;

  await ensureMeals(today());render();
});
